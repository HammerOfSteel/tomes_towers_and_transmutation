<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Building Creator — Tomes, Towers &amp; Transmutation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #1a140f; --panel: rgba(38, 28, 20, 0.85); --panel-border: rgba(200, 169, 110, 0.18);
      --ink: #f0e4d0; --ink-dim: #b3a184; --gold: #d9a84c; --gold-soft: rgba(217, 168, 76, 0.35);
      --wood: #2e2216; --wood-light: #453425;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: var(--bg); }
    body { font-family: 'Quicksand', system-ui, sans-serif; color: var(--ink); }
    #bc-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

    .panel {
      background: var(--panel); border: 1px solid var(--panel-border); border-radius: 16px;
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    #top-bar {
      position: fixed; top: 12px; left: 16px; right: 16px; z-index: 10;
      display: flex; align-items: center; gap: 14px; padding: 8px 16px;
    }
    #title .main { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 22px; color: var(--gold); }
    #title .sub { font-size: 9.5px; color: var(--ink-dim); letter-spacing: 2.2px; text-transform: uppercase; }
    #name-input {
      background: var(--wood); color: var(--ink); border: 1px solid var(--panel-border);
      border-radius: 10px; padding: 7px 12px; font: 600 14px 'Quicksand', sans-serif;
      width: 210px; outline: none; text-align: center; margin-left: auto;
    }
    .icon-btn {
      background: var(--wood); color: var(--ink); border: 1px solid var(--panel-border);
      border-radius: 10px; padding: 7px 11px; font-size: 13px; cursor: pointer;
    }
    .icon-btn:hover { border-color: var(--gold-soft); }

    #panel-left {
      position: fixed; left: 16px; top: 68px; bottom: 16px; width: 300px; z-index: 9;
      display: flex; flex-direction: column; padding: 12px; gap: 10px; overflow-y: auto;
    }
    .section { margin-bottom: 12px; }
    .section-title {
      font-size: 10px; letter-spacing: 1.8px; text-transform: uppercase; color: var(--gold);
      opacity: 0.85; margin-bottom: 8px; border-bottom: 1px solid var(--panel-border); padding-bottom: 4px;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .chip {
      background: var(--wood); color: var(--ink-dim); border: 1px solid transparent;
      border-radius: 999px; padding: 4px 11px; font: 600 11px 'Quicksand', sans-serif; cursor: pointer;
    }
    .chip.active { background: var(--wood-light); color: var(--gold); border-color: var(--gold-soft); }
    .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    .row label { font-size: 12px; color: var(--ink-dim); width: 70px; flex-shrink: 0; }
    .swatch { flex: 0 0 40px; height: 24px; border: 1px solid var(--panel-border); border-radius: 6px; padding: 2px; }
    input[type=range] { flex: 1; }
    #hint {
      position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
      font-size: 11px; color: var(--ink-dim); z-index: 9;
    }
    #status {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: var(--ink-dim); font-size: 13px; text-align: center; display: none; z-index: 5;
    }
  </style>
</head>
<body>
  <canvas id="bc-canvas"></canvas>
  <div id="status">Loading…</div>

  <div id="top-bar" class="panel">
    <div id="title"><div class="main">Building Creator</div><div class="sub">Procedural Asset Designer</div></div>
    <input id="name-input" type="text" placeholder="Building name…" />
    <button id="btn-save" class="icon-btn" title="Save to library">💾 Save</button>
  </div>

  <div id="panel-left" class="panel">
    <div class="section">
      <div class="section-title">Archetype</div>
      <div class="chips" id="kind-chips"></div>
    </div>
    <div class="section">
      <div class="section-title">Faction Style</div>
      <div class="chips" id="faction-chips"></div>
    </div>
    <div class="section">
      <div class="section-title">Size</div>
      <div class="chips" id="size-chips"></div>
    </div>
    <div class="section">
      <div class="section-title">Structure</div>
      <div class="row"><label>Floors</label><div class="chips" id="floors-chips"></div></div>
      <div class="row"><label>Rotation</label><input type="range" id="rotation-slider" min="0" max="6.283" step="0.05" /></div>
    </div>
    <div class="section">
      <div class="section-title">Features</div>
      <div class="chips" id="feature-chips"></div>
    </div>
    <div class="section">
      <div class="section-title">Colors</div>
      <div class="row"><label>Walls</label><input type="color" class="swatch" id="color-walls" /></div>
      <div class="row"><label>Roof</label><input type="color" class="swatch" id="color-roof" /></div>
      <div class="row"><label>Trim</label><input type="color" class="swatch" id="color-trim" /></div>
      <div class="row"><label>Door</label><input type="color" class="swatch" id="color-door" /></div>
    </div>
    <div class="section" style="flex:1">
      <div class="section-title">Gallery</div>
      <div id="gallery-list" style="font-size:11px;color:var(--ink-dim)"></div>
    </div>
  </div>

  <div id="hint">archetype / faction change appearance · scroll = zoom · drag = orbit</div>

  <script type="module" src="/src/world/buildings/main.ts"></script>
</body>
</html>
